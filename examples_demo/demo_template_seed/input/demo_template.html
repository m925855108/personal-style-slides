<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Template Seed</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --ink: #12243f;
      --muted: #62708a;
      --accent: #2d6cdf;
      --rule: #d7dfec;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
    }
    section.slide {
      width: 1600px;
      height: 900px;
      box-sizing: border-box;
      padding: 58px 78px 54px;
      display: grid;
      grid-template-rows: 86px 1fr 34px;
      gap: 22px;
      border-top: 10px solid var(--accent);
    }
    h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 720;
      letter-spacing: 0;
    }
    .content {
      display: grid;
      grid-template-columns: 0.55fr 0.45fr;
      gap: 42px;
      align-items: stretch;
    }
    .figure {
      background: white;
      border: 1px solid var(--rule);
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 24px;
    }
    .notes {
      display: grid;
      gap: 18px;
      align-content: center;
    }
    .card {
      background: white;
      border-left: 5px solid var(--accent);
      border-radius: 6px;
      padding: 22px 24px;
      font-size: 25px;
      line-height: 1.48;
      box-shadow: 0 10px 28px rgba(18, 36, 63, 0.08);
    }
    footer {
      color: var(--muted);
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--rule);
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <section class="slide figure-text">
    <header>
      <h1>Large Evidence Figure With Compact Interpretation</h1>
    </header>
    <main class="content">
      <div class="figure">Figure / result area</div>
      <div class="notes">
        <div class="card">Keep the main evidence large and place interpretation on the right.</div>
        <div class="card">Use restrained blue accents, white panels, and stable footer geometry.</div>
      </div>
    </main>
    <footer>
      <span>Personal Style Slides Demo</span>
      <span>01</span>
    </footer>
  </section>
</body>
</html>
