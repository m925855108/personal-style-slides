    <!-- Slide title -->
  </header>

  <main class="slide-content pss-content pss-figure-text">
    <figure class="pss-figure figure-half">
      <!-- <img src="figures/example.png" alt="..." /> -->

    <span class="slide-number"><!-- 1 / N --></span>
  </footer>
</section>
